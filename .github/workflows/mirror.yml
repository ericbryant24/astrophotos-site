name: Mirror live site (one-time)
on:
  push:
    paths: ['.github/workflows/mirror.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror front end of astrophotos.ericwbryant.com
        run: |
          rm -rf mirror && mkdir -p mirror && cd mirror
          wget -e robots=off --recursive --level=2 --page-requisites --no-parent -nH \
            --reject-regex '/(api|admin)' \
            https://astrophotos.ericwbryant.com/ \
            https://astrophotos.ericwbryant.com/index.html \
            https://astrophotos.ericwbryant.com/gallery.html || true
          find . -type f | sort > ../mirror-files.txt
          cat ../mirror-files.txt
      - name: Commit mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add mirror mirror-files.txt
          git commit -m "Mirror live site front end" || echo "nothing to commit"
          git push
