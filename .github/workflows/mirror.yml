name: Fetch from Azure (one-time)
on:
  push:
    paths: ['scripts/fetch.sh', '.github/workflows/mirror.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fetch script
        run: bash scripts/fetch.sh
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A fetch site 2>/dev/null || git add -A fetch
          git commit -m "Fetch content from Azure" || echo "nothing to commit"
          git push
