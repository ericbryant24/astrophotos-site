<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="resources/telescope_favicon_32x32.png">
    <title>Eric's Astrophotography - Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/lightbox.css">
    <link rel="stylesheet" href="css/featured-tags.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/sticky-header.css">
</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="logo">
                <a href="index.html">Eric's Astrophotography</a>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="gallery.html" class="nav-link active">Gallery</a>
            </div>
        </nav>

        <div class="sorting-controls">
            <span class="sort-label">Sort by:</span>
            <button class="sort-button active" data-sort="date">Date</button>
            <button class="sort-button" data-sort="name">Name</button>
        </div>
    </header>

    <div class="featured-tags-container">
        <div class="featured-tags">
            <span class="featured-tags-label">Quick Filters:</span>
            <div class="featured-tags-buttons" id="featured-tags-buttons">
                <button class="featured-tag-button favorite-tag" data-tag="Eric's Favorite">
                    <svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    Eric's Favorite
                </button>
            
                <button class="featured-tag-button" data-tag="Galaxy">
                    Galaxy
                </button>
            
                <button class="featured-tag-button" data-tag="Nebula">
                    Nebula
                </button>
            
                <button class="featured-tag-button" data-tag="Star Cluster">
                    Star Cluster
                </button>
            </div>
        </div>
    </div>
            
    <div id="tag-filter-container"></div>
            
    <div class="gallery" id="combined-gallery">
        <div class="loading" id="loading-indicator">Loading gallery items...</div>
    </div>
    
    <div class="lightbox" id="lightbox">
        <div class="close-lightbox" onclick="closeLightbox()">×</div>
        <div class="nav-indicators">
            <div class="nav-button" id="prev-button" onclick="navigateImages(-1)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </div>
            <div class="nav-button" id="next-button" onclick="navigateImages(1)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
        </div>
        <div class="lightbox-slider" id="lightbox-slider">
            <div class="lightbox-slide current-slide" id="current-slide">
                <div class="lightbox-content">
                    <img class="lightbox-media" id="lightbox-image" src="" alt="" style="display: none;">
                    <video class="lightbox-media" id="lightbox-video" controls style="display: none;">
                        <source src="" type="">
                    </video>
                </div>
                <div class="lightbox-description" id="lightbox-description"></div>
            </div>
            <div class="lightbox-slide next-slide" id="next-slide">
                <div class="lightbox-content">
                    <img class="lightbox-media" id="next-lightbox-image" src="" alt="" style="display: none;">
                    <video class="lightbox-media" id="next-lightbox-video" controls style="display: none;">
                        <source src="" type="">
                    </video>
                </div>
                <div class="lightbox-description" id="next-lightbox-description"></div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2025 Eric Bryant. All rights reserved.</p>
    </footer>
    
    <!-- Load JavaScript files -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/touch-controls.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/featured-tags.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
